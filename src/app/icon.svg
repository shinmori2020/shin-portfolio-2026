<!-- ロゴ SHIN の頭文字を円弧2本で組んだモノグラム。
     実際に見られるのは 16px なので その大きさで読めることを最優先にしている。

     ・地はオフホワイトのまま。ブラウザのタブ色は利用者の設定で明暗が変わるため
       地を深緑にすると暗いタブに溶ける（比較検証で確認済み）。
     ・書体は使わず円弧で描く。フォントの読み込みに左右されないため。
     ・線は 4/32（16px 表示で 2px）。これ以上細いとタブの中で潰れる。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#f4f3ef"/>
  <path d="M20.8 8.2 A5 5 0 1 0 16 16 A5 5 0 1 1 11.2 23.8"
        fill="none" stroke="#214034" stroke-width="4" stroke-linecap="round"/>
</svg>
